/* ============ calculations ============ */
function calcTargets(p){
 const bmr=10*p.kg+6.25*p.cm-5*p.age+(p.sex==="m"?5:-161);
 const tdee=bmr*p.act;
 const min=p.sex==="m"?1500:1200;
 return{kcal:Math.max(min,R(tdee*0.82/10)*10),protein:Math.min(150,Math.max(50,R(p.kg*1.4)))};
}
function totals(k){const l=S.food[k]||[];let c=0,p=0;l.forEach(x=>{c+=x.kcal;p+=x.p});return{c:R(c),p:R(p*10)/10}}
function planned(k){const o=S.over[k];if(o==="add")return true;if(o==="off")return false;return S.days.indexOf(parse(k).getDay())>=0}
function setPlanned(k,on){const base=S.days.indexOf(parse(k).getDay())>=0;if(on===base)delete S.over[k];else S.over[k]=on?"add":"off"}
function missed(){const out=[];const t=today();let from=S.created;const lim=addDays(t,-10);if(from<lim)from=lim;for(let k=from;k<t;k=addDays(k,1)){if(planned(k)&&!S.workouts[k])out.push(k)}return out}
function nextFree(){const t=today();for(let i=1;i<=14;i++){const k=addDays(t,i);if(!planned(k)&&!S.workouts[k])return k}return addDays(t,1)}
function weekDone(ws){let n=0;for(let i=0;i<7;i++)if(S.workouts[addDays(ws,i)])n++;return n}
function weekPlanned(ws){let n=0;for(let i=0;i<7;i++){const k=addDays(ws,i);if(planned(k)||S.workouts[k])n++}return n}
function recommend(wd,en,tm){
 let mode,why,mins;
 if(wd===2&&en===1){mode="recovery";mins=Math.min(10,tm);why="Exhausting day and low energy: a gentle walk and stretch keeps the habit alive and helps you unwind. Showing up counts."}
 else if(wd===2||en===1){mode="light";mins=Math.min(15,tm);why=(wd===2?"Exhausting day":"Low energy")+": a shorter, lighter session with longer rests. You still get it done without draining yourself."}
 else if(wd===1&&en===2){mode="standard";mins=Math.min(25,tm);why="Steady day and okay energy: a solid, slightly shorter session today."}
 else{mode="standard";mins=Math.min(30,tm);why="You have the energy: here is your full session at your current level."}
 return{mode,mins,why}
}
function buildSession(mode,mins,level){
 const seed=Math.floor(Date.now()/864e5);
 const L=mode==="standard"?level:1;
 const sets=mode==="standard"?[2,2,3,3][level-1]:2;
 const rest=mode==="standard"?[45,40,35,30][level-1]:60;
 const work=it=>it.u==="s"?it.val:it.val*3.5;
 const secsOf=it=>it.sets*(work(it)+it.rest);
 const mk=(e,o,ph)=>Object.assign({id:e.id,n:e.n,u:e.u,ps:e.ps,steps:e.steps,val:e.v[Math.min(L,4)-1]||e.v[3],sets:1,rest:10,phase:ph},o||{});
 const byT=t=>EX.filter(e=>e.t===t);
 let items=[];
 if(mode==="recovery"){
  items.push(mk(exById("w1"),{val:180},"warm"));
  ["w2","w3"].forEach(i=>items.push(mk(exById(i),{val:40},"warm")));
  ["c1","c2","c3","c4","c5"].forEach(i=>items.push(mk(exById(i),{val:45},"cool")));
  return{items,secs:items.reduce((a,b)=>a+secsOf(b),0)};
 }
 const warmIds=mins<=20?["w1","w2"]:["w1","w2","w3"];
 const coolIds=mins<=20?["c1","c3","c5"]:["c1","c2","c3","c5"];
 const warm=warmIds.map(i=>mk(exById(i),null,"warm"));
 const cool=coolIds.map(i=>mk(exById(i),null,"cool"));
 const fixed=[...warm,...cool].reduce((a,b)=>a+secsOf(b),0);
 const budget=mins*60-fixed;
 const tpl=["cardio","lower","upper","core","cardio","lower","core","upper","cardio","lower","core","upper"];
 const used=new Set();let t=0;const main=[];
 tpl.forEach((ty,i)=>{
  const c=byT(ty).filter(e=>L>=e.lv[0]&&L<=e.lv[1]&&!used.has(e.id)&&(mode==="standard"||e.low));
  if(!c.length)return;
  const e=c[(seed+i)%c.length];
  const it=mk(e,{sets,rest},"main");
  const s=secsOf(it);
  if(t+s>budget)return;
  used.add(e.id);main.push(it);t+=s;
 });
 items=[...warm,...main,...cool];
 return{items,secs:fixed+t};
}
const rx=it=>it.phase==="main"?`${it.sets} sets × ${it.val} ${it.u==="s"?"sec":"reps"}${it.ps?" each side":""} · rest ${it.rest}s`:`${it.val} sec${it.ps?" each side":""}`;

function ring(p,color,big,small,label){const r=34,c=2*Math.PI*r,q=Math.max(0,Math.min(1,p));
 return `<div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" class="rbg"/><circle cx="40" cy="40" r="${r}" class="rfg" style="stroke:${color};stroke-dasharray:${(c*q).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 40 40)"/></svg><div class="rin"><b>${big}</b><span>${small}</span></div><div class="rl">${label}</div></div>`}

function tip(){const d=parse(today());return TIPS[(d.getDate()+d.getMonth())%TIPS.length]}

 let last="";
 s.items.forEach((it,i)=>{
  if(it.phase!==last){last=it.phase;h+=`<div class="phase">${{warm:"Warm-up",main:"Main circuit",cool:"Cool-down"}[it.phase]}</div>`}

function mealBlock(name,list,k){

 const c=R(list.reduce((a,b)=>a+b.kcal,0)),p=R(list.reduce((a,b)=>a+b.p,0));
 return `<div class="card"><div class="row between"><b>${name}</b><span class="small mut">${c} kcal · ${p} g</span></div>${list.map(x=>`<div class="item"><div>${esc(x.name)}<div class="small mut">${R(x.kcal)} kcal · ${R(x.p*10)/10} g protein</div></div><button class="sm ghost" data-act="del" data-id="${x.id}">✕</button></div>`).join("")}</div>`;
}
function foodResults(q){
 q=(q||"").toLowerCase().trim();
 const list=FOODS.map((f,i)=>({f,i})).filter(o=>!q||o.f[0].toLowerCase().includes(q)).slice(0,q?14:8);

 return list.map(o=>`<div class="item"><div>${esc(o.f[0])}<div class="small mut">${esc(o.f[1])} · ${o.f[2]} kcal · ${o.f[3]} g protein</div></div><button class="sm" data-act="qadd" data-i="${o.i}">+ Add</button></div>`).join("");
}
function vFood(){
 const k=T.fd||today();if(!T.meal)T.meal=defMeal();
 const P=S.profile,t=totals(k),list=S.food[k]||[];
 const left=P.kcal-t.c,pleft=P.protein-t.p;
 const ok=t.c<=P.kcal*1.05;
 let msg;
 if(t.c===0)msg="Nothing logged yet. Start with your first meal!";
 else if(t.c>P.kcal*1.1)msg="A bit above target today. No stress: a lighter, protein-rich dinner or a walk will balance it out.";
 else if(t.p>=P.protein&&ok)msg="Targets met. Calories controlled and protein hit. 💪";
 else if(ok)msg=`You are within your calories. ${Math.max(0,R(pleft))} g more protein to go.`;
 else msg="Just around your calorie target. Choose a protein-rich option for the rest of the day.";
 let sug="";
 if(k===today()&&pleft>10&&left>80){
  const c=FOODS.filter(f=>f[2]<=Math.max(left,100)&&f[3]>=8).sort((a,b)=>b[3]/b[2]-a[3]/a[2]).slice(0,3);
  if(c.length)sug=`<div class="small" style="margin-top:8px"><b>Protein ideas that fit:</b> ${c.map(f=>esc(f[0])+" ("+f[3]+" g, "+f[2]+" kcal)").join(" · ")}</div>`}
 const bc=t.c>P.kcal*1.1?"var(--bad)":t.c>P.kcal?"var(--warn)":"var(--acc)";
 // weekly
 const days=[];for(let i=6;i>=0;i--)days.push(addDays(today(),-i));
 const tots=days.map(totals);const mx=Math.max(P.kcal*1.3,...tots.map(x=>x.c));
 const logged=tots.filter(x=>x.c>0);
 const avgP=logged.length?R(logged.reduce((a,b)=>a+b.p,0)/logged.length):0;
 const onT=tots.filter(x=>x.c>0&&x.c<=P.kcal*1.05&&x.p>=P.protein*0.9).length;
 let h=`<div class="row between" style="margin-top:6px"><button class="sm ghost" data-act="fprev">◀</button><b>${k===today()?"Today":nice(k)}</b><button class="sm ghost" data-act="fnext" ${k>=today()?"disabled style='opacity:.3'":""}>▶</button></div>
 <div class="card"><div class="row between"><b>Calories</b><span><b>${t.c}</b> / ${P.kcal} kcal</span></div><div class="bar" style="margin:6px 0 10px"><i style="width:${Math.min(100,t.c/P.kcal*100)}%;background:${bc}"></i></div>
 <div class="row between"><b>Protein</b><span><b>${t.p}</b> / ${P.protein} g</span></div><div class="bar" style="margin:6px 0 10px"><i style="width:${Math.min(100,t.p/P.protein*100)}%;background:var(--ok)"></i></div>
 <div class="grid2"><div class="small"><span class="mut">Calories left</span><br><b style="font-size:18px">${left>=0?left:"0 (+"+(-left)+")"}</b></div><div class="small"><span class="mut">Protein left</span><br><b style="font-size:18px">${Math.max(0,R(pleft))} g</b></div></div>
 <div style="margin-top:8px">${msg}</div>${sug}</div>
 <div class="card"><h3>Quick add</h3><div class="row wrap" style="margin-bottom:8px">${["Breakfast","Lunch","Snack","Dinner"].map(m=>`<button class="pill ${T.meal===m?"on":""}" data-act="meal" data-v="${m}">${m}</button>`).join("")}</div>
 <input id="fq" placeholder="Search foods (roti, paneer, banana...)" autocomplete="off"><div id="fres">${foodResults("")}</div>
 <details style="margin-top:8px"><summary>+ Add custom food</summary><label class="f">Food name</label><input id="cf_n"><div class="grid2"><div><label class="f">Calories (kcal)</label><input id="cf_c" type="number" inputmode="decimal"></div><div><label class="f">Protein (g)</label><input id="cf_p" type="number" inputmode="decimal"></div></div><button class="full" style="margin-top:10px" data-act="addcustom">Add to ${T.meal}</button></details></div>
 ${["Breakfast","Lunch","Snack","Dinner"].map(m=>mealBlock(m,list.filter(x=>x.meal===m),k)).join("")}
 <div class="card"><div class="row between"><h3>Last 7 days</h3><span class="small mut">Avg protein ${avgP} g · ${onT}/7 days on target</span></div>
 <div class="bars"><div class="tline" style="bottom:${P.kcal/mx*100}%"></div>${tots.map(x=>`<div><i style="height:${x.c/mx*100}%;background:${x.c>P.kcal*1.1?"var(--bad)":"var(--acc)"}"></i></div>`).join("")}</div>
 <div class="blab">${days.map(d=>`<span>${DN[parse(d).getDay()][0]}</span>`).join("")}</div><div class="small mut" style="margin-top:4px">Dashed line = your calorie target (${P.kcal})</div></div>`;

function cravOut(q){
 q=q.toLowerCase();const hits=CRAVE.filter(c=>c.k.some(w=>q.includes(w)));
 if(!hits.length)return`<div class="card"><b>I do not have a swap for that yet.</b><div class="mut" style="margin-top:4px">General rule that works for most cravings:</div><ol><li>Pick a smaller portion (about 1/3 of the usual).</li><li>Put it on a plate and sit down to eat it slowly.</li><li>Pair it with protein (curd, egg, paneer, sprouts) so you stay full.</li><li>Log it. Nothing is off limits.</li></ol><div class="small mut">Try: pizza, burger, sweet, chocolate, ice cream, chips, samosa, biryani, pasta, cold drink.</div></div>`;
 return hits.map(c=>`<div class="card"><h2>${c.title}</h2><div class="small mut">Usual version: ${esc(c.reg)}</div>${c.opts.map((o,i)=>`<div class="ex"><div class="exn">${esc(o.n)}</div><div style="margin:4px 0"><span class="badge">${o.kcal} kcal</span><span class="badge">${o.p} g protein</span><span class="badge">⏱ ${esc(o.t)}</span></div><div>${esc(o.why)}</div>
 <details ${hits.length===1&&i===0?"open":""}><summary>Ingredients & steps</summary><b class="small">Ingredients</b><ul>${o.ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><b class="small">Method</b><ol>${o.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>
 <div class="row wrap" style="margin-top:8px"><button class="sm" data-act="logcrave" data-c="${c.id}" data-o="${i}">+ Log it</button><a class="btn sm sec" target="_blank" rel="noopener" href="${yt("healthy "+o.n+" recipe")}">▶ Watch recipe</a></div></div>`).join("")}</div>`).join("");
}
function cookOut(id){
 const d=DISHES.find(x=>x.id===id);if(!d)return"";
 const cats=["Protein","Veg & fibre","Extra","Swap"];
 let rows="";let idx=0;
 const order=d.add.map((a,i)=>({a,i}));
 cats.forEach(cat=>{const g=order.filter(o=>o.a[3]===cat);if(!g.length)return;
  rows+=`<div class="phase">${cat==="Swap"?"Healthy swaps":cat==="Extra"?"Extras":cat}</div>`+g.map(o=>`<div class="addrow"><input type="checkbox" data-ai="${o.i}"><div class="t">${esc(o.a[0])}<small class="${o.a[1]<0?"neg":""}">${o.a[1]>0?"+":""}${o.a[1]} kcal · ${o.a[2]>0?"+":""}${o.a[2]} g protein</small></div><select data-am="${o.i}"><option value="0.5">×½</option><option value="1" selected>×1</option><option value="2">×2</option><option value="3">×3</option></select></div>`).join("")});
 return `<div class="card"><h2>${esc(d.name)}</h2><div class="small mut">Base: ${d.kcal} kcal and ${d.p} g protein per ${d.unit}</div>
 <label class="f">How many ${esc(d.unit.split(" (")[0])}s are you cooking?</label><input id="cserv" type="number" step="0.5" min="0.5" value="1" inputmode="decimal">
 <div class="small mut" style="margin-top:8px">Tick what you will add and set the quantity multiplier (×1 = the amount shown).</div>${rows}
 <div class="card" style="background:var(--acc2);margin-bottom:0;margin-top:10px" id="ctot"></div>
 <div class="phase">Healthier cooking tips</div><ul>${d.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
 <label class="f">I will eat</label><select id="cshare"><option value="1">The whole thing</option><option value="0.5">Half</option><option value="0.33">A third</option><option value="0.25">A quarter</option></select>
 <div class="row wrap" style="margin-top:10px"><button data-act="logcook">+ Log my portion</button><a class="btn sec" target="_blank" rel="noopener" href="${yt("healthy "+d.name.split(" (")[0]+" recipe high protein")}">▶ Watch ideas</a></div></div>`;
}
function calcCook(){
 const d=DISHES.find(x=>x.id===T.dish);const box=$("#ctot");if(!d||!box)return;
 let serv=parseFloat($("#cserv").value);if(!(serv>0))serv=1;serv=Math.min(serv,20);
 let bk=d.kcal*serv,bp=d.p*serv,k=bk,p=bp;
 document.querySelectorAll("[data-ai]").forEach(cb=>{if(cb.checked){const i=+cb.dataset.ai,m=parseFloat(document.querySelector('[data-am="'+i+'"]').value)||1;k+=d.add[i][1]*m;p+=d.add[i][2]*m}});
 k=Math.max(0,k);p=Math.max(0,p);
 const dens=k>0?R(p/k*1000)/10:0,bdens=bk>0?R(bp/bk*1000)/10:0;
 box.innerHTML=`<div class="row between"><div><div class="small mut">Original</div><b>${R(bk)} kcal · ${R(bp)} g</b></div><div style="font-size:20px">→</div><div><div class="small mut">Improved</div><b style="color:var(--acc)">${R(k)} kcal · ${R(p*10)/10} g</b></div></div><div class="small" style="margin-top:6px">Protein per 100 kcal: ${bdens} g → <b>${dens} g</b>. Estimates are approximate.</div>`;
 const sh=parseFloat($("#cshare").value)||1;
 T.cookLog={name:d.name.split(" (")[0]+" (improved)",kcal:k*sh,p:p*sh};
}
function svgWeights(){
 const w=S.weights;if(w.length<2)return`<div class="small mut" style="padding:12px 0">Log at least two weigh-ins to see your trend.</div>`;
 const W=320,H=140,pd=26;const kg=w.map(x=>x.kg);let mn=Math.min(...kg)-1,mx=Math.max(...kg)+1;
 const x=i=>pd+(w.length===1?0:i*(W-pd*2)/(w.length-1)),y=v=>H-pd-(v-mn)/(mx-mn)*(H-pd*2);
 const pts=w.map((o,i)=>x(i)+","+y(o.kg)).join(" ");
 const ma=w.map((o,i)=>{const s=w.slice(Math.max(0,i-2),i+1);return x(i)+","+y(s.reduce((a,b)=>a+b.kg,0)/s.length)}).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><polyline points="${pts}" fill="none" stroke="var(--mut)" stroke-width="1.5" stroke-dasharray="3 3"/><polyline points="${ma}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>${w.map((o,i)=>`<circle cx="${x(i)}" cy="${y(o.kg)}" r="3" fill="var(--acc)"/>`).join("")}<text x="4" y="${y(mx-1)+4}" font-size="10" fill="var(--mut)">${(mx-1).toFixed(1)}</text><text x="4" y="${y(mn+1)+4}" font-size="10" fill="var(--mut)">${(mn+1).toFixed(1)}</text></svg><div class="row between small mut"><span>${nice(w[0].d)}</span><span>${nice(w[w.length-1].d)}</span></div>`;
}
function vProgress(){
 const P=S.profile,w=S.weights,ws=weekStart(today());
 const total=Object.keys(S.workouts).length;
 const mins=Object.values(S.workouts).reduce((a,b)=>a+(b.mins||0),0);
 const first=w.length?w[0].kg:P.kg,cur=w.length?w[w.length-1].kg:P.kg;
 const diff=R((cur-first)*10)/10,toGoal=R((cur-P.goal)*10)/10;
 // weekly bars (last 4 weeks)
 const wb=[];for(let i=3;i>=0;i--){const s=addDays(ws,-7*i);wb.push({n:weekDone(s),p:Math.max(weekPlanned(s),S.days.length)})}
 // feedback
 let fb=[];
 const rec=w.filter(x=>x.d>=addDays(today(),-21));
 if(rec.length>=2){const a=rec[0],b=rec[rec.length-1];const days=Math.max(1,(parse(b.d)-parse(a.d))/864e5);const perWk=(b.kg-a.kg)/days*7;
  if(perWk<-1)fb.push("Your weight is dropping faster than ideal. Add a snack and a protein source and keep workouts moderate. Slower is safer and more lasting.");
  else if(perWk<-0.1)fb.push("Your trend is heading down at a healthy pace. Keep going. This is exactly how sustainable fat loss looks.");
  else if(perWk<=0.2)fb.push("Weight is steady. Daily weight swings of 1–2 kg are normal; focus on workouts, protein and portions for a few more weeks.");
  else fb.push("Weight is up a little recently. That can be water or muscle at the start. Stay consistent and check the 2-week trend before changing anything.")}
 const cw=weekDone(ws),pw=weekPlanned(ws);
 if(cw>=pw&&pw>0)fb.push("You hit your workout goal this week. Brilliant consistency. 🔥");
 else if(cw>0)fb.push(`${cw} workout${cw>1?"s":""} done this week. Every session counts, even short ones.`);
 else fb.push("No workouts yet this week. A 10-minute session today is a great restart.");
 if(!fb.length)fb.push("Keep logging. Small steps add up.");
 return `<div class="grid2"><div class="card"><div class="small mut">Workouts done</div><b style="font-size:26px">${total}</b><div class="small mut">${mins} active min</div></div><div class="card"><div class="small mut">Level</div><b style="font-size:26px">${S.level}</b><div class="small mut">${LEVELS[S.level-1]}</div></div></div>
 <div class="card"><h3>Weekly consistency</h3><div class="bars" style="height:90px">${wb.map(b=>`<div><i style="height:${Math.min(100,b.n/b.p*100)}%;background:${b.n>=b.p?"var(--ok)":"var(--acc)"}"></i></div>`).join("")}</div><div class="blab">${wb.map((b,i)=>`<span>${b.n}/${b.p}${i===3?"<br>this wk":""}</span>`).join("")}</div></div>
 <div class="card"><div class="row between"><h3>Body weight</h3><span class="small mut">${cur} kg · ${diff>0?"+":""}${diff} since start · ${toGoal>0?toGoal+" kg to goal":"goal reached!"}</span></div>${svgWeights()}
 <div class="small mut">Orange = smoothed trend. Dotted = daily readings.</div>
 <div class="row" style="margin-top:10px"><input id="wkg" type="number" step="0.1" inputmode="decimal" placeholder="Today's weight (kg)"><button data-act="addw">Save</button></div></div>
 <div class="card" style="background:var(--acc2)"><b>🎯 Your coach says</b><ul>${fb.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

let restInt=null;
function startRest(sec){
 stopRest();T.rest=sec;const bar=$("#restBar");if(!bar)return;bar.classList.add("on");

 tick();restInt=setInterval(tick,1000);
}
function stopRest(){clearInterval(restInt);restInt=null;const b=$("#restBar");if(b)b.classList.remove("on")}

/* ============ actions ============ */
const A={
 tab(el){T.cfg=false;T.tab=el.dataset.v;render()},
 opencfg(){T.cfg=true;render()},
 closecfg(){T.cfg=false;render()},
 onboard(){
  const g=id=>$("#"+id).value;
  const p={name:g("ob_name").trim(),sex:g("ob_sex"),age:+g("ob_age")||30,cm:+g("ob_cm")||170,kg:+g("ob_kg")||75,goal:+g("ob_goal")||70,act:+g("ob_act")||1.2};
  if(p.age<16||p.age>90||p.cm<120||p.cm>230||p.kg<35||p.kg>250){toast("Please check your age, height and weight.");return}
  Object.assign(p,calcTargets(p));S.profile=p;S.created=today();S.weights=[{d:today(),kg:p.kg}];save();render();toast("Welcome! Your daily targets are set. You can edit them in ⚙️.");
 },
 recalc(){const g=id=>$("#"+id).value;const P=Object.assign({},S.profile,{sex:g("s_sex"),age:+g("s_age"),cm:+g("s_cm"),act:+g("s_act")});const w=S.weights.length?S.weights[S.weights.length-1].kg:P.kg;const t=calcTargets(Object.assign({},P,{kg:w}));$("#s_kcal").value=t.kcal;$("#s_prot").value=t.protein;toast("Suggested targets filled in. Press Save to keep them.")},
 togday(el){const d=+el.dataset.d;const i=S.days.indexOf(d);if(i>=0)S.days.splice(i,1);else S.days.push(d);el.classList.toggle("on")},
 savecfg(){
  const g=id=>$("#"+id).value;const P=S.profile;
  P.name=g("s_name").trim();P.sex=g("s_sex");P.age=+g("s_age")||P.age;P.cm=+g("s_cm")||P.cm;P.goal=+g("s_goal")||P.goal;P.act=+g("s_act");
  const min=P.sex==="m"?1500:1200;let k=+g("s_kcal")||P.kcal;
  if(k<min){k=min;toast("Calories raised to the safe minimum ("+min+").")}
  P.kcal=R(k);P.protein=Math.min(250,Math.max(30,R(+g("s_prot")||P.protein)));
  S.level=+g("s_lvl")||1;if(!S.days.length)S.days=[1,3,5];
  save();T.cfg=false;render();
 },
 export(){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="noexcuse-backup.json";document.body.appendChild(a);a.click();a.remove()},
 reset(){if(confirm("Erase ALL NOEXCUSE data on this device?")){localStorage.removeItem(KEY);S=defaults();T.cfg=false;T.sess=null;T.rec=null;render()}},
 /* workout */
 wd(el){T.chk.wd=+el.dataset.v;render(true)},en(el){T.chk.en=+el.dataset.v;render(true)},tm(el){T.chk.tm=+el.dataset.v;render(true)},
 getplan(){const c=T.chk;if(c.wd===null||c.en===null){toast("Pick your workday and energy level first.");return}T.rec=recommend(c.wd,c.en,c.tm);render(true)},
 setmode(el){const m=el.dataset.v,c=T.chk;const mins={recovery:Math.min(10,c.tm),light:Math.min(15,c.tm),standard:c.tm};const why={recovery:"Gentle option chosen: walk and stretch only.",light:"Light session chosen: easier moves with longer rests.",standard:"Full session chosen: you know your body best. Stop if anything hurts."};T.rec={mode:m,mins:mins[m],why:why[m]};render(true)},
 start(){const r=T.rec;if(!r)return;const b=buildSession(r.mode,r.mins,S.level);T.sess={mode:r.mode,mins:r.mins,level:r.mode==="standard"?S.level:1,items:b.items,secs:b.secs,done:{}};render()},
 toggleEx(el){const i=+el.dataset.i;T.sess.done[i]=el.checked;const c=$("#ex"+i);if(c)c.classList.toggle("done",el.checked);updSess()},
 rest(el){startRest(+el.dataset.s)},restStop(){stopRest()},
 exit(){if(confirm("Leave this workout? Progress ticks will be lost.")){stopRest();T.sess=null;render()}},
 finish(el){
  const s=T.sess;const d=Object.values(s.done).filter(Boolean).length;
  if(d===0){toast("Tick off at least one exercise before finishing.");return}
  stopRest();const feel=el.dataset.v,k=today();
  const prev=S.workouts[k];const mins=R(s.secs/60*Math.min(1,d/s.items.length+0.15));
  S.workouts[k]={mode:s.mode,mins:(prev?prev.mins:0)+Math.max(5,Math.min(mins,s.mins+3)),feel,level:s.level};
  let msg="Workout logged. Nice work! 🎉";
  if(s.mode!=="recovery"){
   const base=s.mode==="standard"?1:0.5,mult={easy:1.5,right:1,tough:0.75}[feel];
   S.points+=base*mult;
   if(feel==="tough"&&s.mode==="standard")S.tough++;else S.tough=0;
   if(S.points>=4&&S.level<4){S.level++;S.points=0;S.tough=0;msg="Level up! You are now Level "+S.level+" ("+LEVELS[S.level-1]+") 🚀"}
   else if(S.tough>=2&&S.level>1){S.level--;S.tough=0;S.points=2;msg="We eased things a notch so it stays enjoyable. Progress is not a race. 👏"}
  }
  save();T.sess=null;T.rec=null;T.tab="today";render();toast(msg);
 },
 resched(el){const k=el.dataset.k,to=el.dataset.to==="today"?today():nextFree();setPlanned(k,false);setPlanned(to,true);save();render(true);toast("Moved to "+nice(to)+". The rest of your plan is unchanged.")},
 skip(el){setPlanned(el.dataset.k,false);save();render(true);toast("Skipped. No guilt, onwards!")},
 moveTomorrow(){const to=nextFree();setPlanned(today(),false);setPlanned(to,true);save();render();toast("Moved to "+nice(to)+".")},
 togplan(el){const k=el.dataset.k;if(S.workouts[k]){toast("Already completed ✔");return}setPlanned(k,!planned(k));save();render(true)},
 /* food */
 meal(el){T.meal=el.dataset.v;render(true)},
 fprev(){T.fd=addDays(T.fd||today(),-1);render(true)},
 fnext(){const n=addDays(T.fd||today(),1);T.fd=n>=today()?null:n;render(true)},
 qadd(el){const f=FOODS[+el.dataset.i];addFood(f[0]+" ("+f[1]+")",f[2],f[3]);toast("Added "+f[0])},
 addcustom(){const n=$("#cf_n").value.trim(),c=parseFloat($("#cf_c").value),p=parseFloat($("#cf_p").value)||0;if(!n||!(c>=0)||isNaN(c)){toast("Enter a name and calories.");return}addFood(n,c,p)},
 del(el){const k=T.fd||today();S.food[k]=(S.food[k]||[]).filter(x=>String(x.id)!==el.dataset.id);save();render(true)},
 /* coach */
 cmode(el){T.coach=el.dataset.v;render()},
 crave(){const v=$("#cin").value.trim();T.cravQ=v;$("#cout").innerHTML=v?cravOut(v):""},
 cravechip(el){T.cravQ=el.dataset.v;$("#cin").value=el.dataset.v;$("#cout").innerHTML=cravOut(el.dataset.v)},
 logcrave(el){const c=CRAVE.find(x=>x.id===el.dataset.c),o=c.opts[+el.dataset.o];addFood(o.n,o.kcal,o.p,"Snack");toast("Logged to today: "+o.n)},
 cook(){const v=$("#kin").value.trim().toLowerCase();T.cookQ=v;const d=DISHES.find(x=>x.k.some(w=>v.includes(w)));if(d){T.dish=d.id;render(true);calcCook()}else toast("Pick a dish from the chips below. More coming soon!")},
 dish(el){T.dish=el.dataset.v;render(true);calcCook()},
 logcook(){if(!T.cookLog)return;addFood(T.cookLog.name,T.cookLog.kcal,T.cookLog.p,defMeal());toast("Logged to today: "+R(T.cookLog.kcal)+" kcal, "+R(T.cookLog.p)+" g protein")},
 /* progress */
 addw(){const v=parseFloat($("#wkg").value);if(!(v>25&&v<300)){toast("Enter a valid weight in kg.");return}const k=today();S.weights=S.weights.filter(x=>x.d!==k);S.weights.push({d:k,kg:R(v*10)/10});S.weights.sort((a,b)=>a.d<b.d?-1:1);save();render(true);toast("Weight saved ✔")}
};
function addFood(name,kcal,p,meal){const k=T.fd||today();const kk=meal?today():k;(S.food[kk]=S.food[kk]||[]).push({id:Date.now()+Math.floor(Math.random()*1000),meal:meal||T.meal||defMeal(),name,kcal:R(kcal),p:R(p*10)/10});save();if(!meal)render(true)}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;if(el.tagName==="INPUT")return;const f=A[el.dataset.act];if(f)f(el)});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.act==="toggleEx"){A.toggleEx(t);return}
 if(t.id==="cserv"||t.id==="cshare"||t.dataset.ai!==undefined||t.dataset.am!==undefined)calcCook();
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="fq"){$("#fres").innerHTML=foodResults(t.value)}
 if(t.id==="cserv")calcCook();
});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="cin")A.crave();if(e.target.id==="kin")A.cook()});
render();
})();
</script>
</body>
</html>
